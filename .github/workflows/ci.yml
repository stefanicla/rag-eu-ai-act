name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Guard against committed secrets/corpus
        run: |
          test ! -e .env || (echo "::error::.env must never be committed" && exit 1)
          test -z "$(git ls-files 'data/raw/*' ':!:data/raw/.gitkeep')" || (echo "::error::corpus files under data/raw/ must stay gitignored" && exit 1)
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run python -m compileall -q src
      - run: uv run pytest -q
